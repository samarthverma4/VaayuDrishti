[project]
name = "vyomtra"
version = "0.1.0"
description = "VYOMTRA: ensemble-aware extreme-weather intelligence for India"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "xarray>=2024.6",
    "zarr>=3.0",
    "icechunk>=2.2.2",
    "pystac>=1.10",
    "dask>=2024.6",
    "shapely>=2.0",
    "pyproj>=3.6",
    "requests>=2.32",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "lxml>=5.2",
    "pillow>=10.3",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "contourpy>=1.2",
]

[project.optional-dependencies]
grib = ["cfgrib>=0.9.14", "eccodes>=2.37"]
dev = ["pytest>=8.2", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
